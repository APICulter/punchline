# nginx site for Punchline: HTTPS (Let's Encrypt / certbot) in front of the Node server.
#   sudo cp deploy/nginx-punchline.conf /etc/nginx/sites-available/punchline
#   replace punchline.example.com (4 times) with your domain
#   sudo ln -s /etc/nginx/sites-available/punchline /etc/nginx/sites-enabled/punchline
#   sudo nginx -t && sudo systemctl reload nginx
# The server must run with TRUST_PROXY=loopback so that it trusts the X-Forwarded-* headers below.

# WebSocket upgrade for socket.io ("" keeps upstream keep-alive for plain requests)
map $http_upgrade $connection_upgrade {
	default upgrade;
	""      "";
}

# Admin sign-in: at most 10 attempts a minute per address, before the app's own limit
limit_req_zone $binary_remote_addr zone=punchline_login:1m rate=10r/m;

upstream punchline_app {
	server 127.0.0.1:3000;
	keepalive 16;
}

# HTTP: Let's Encrypt challenges, everything else goes to HTTPS
server {
	listen 80;
	listen [::]:80;
	server_name punchline.example.com;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	# Ubuntu 24.04 ships nginx 1.24: "listen ... http2". From nginx 1.25.1 the preferred form is
	# "listen 443 ssl;" + "http2 on;" (the old one still works, with a warning)
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_tokens off;
	server_name punchline.example.com;

	# created by: sudo certbot certonly --nginx -d punchline.example.com
	ssl_certificate     /etc/letsencrypt/live/punchline.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/punchline.example.com/privkey.pem;
	# installed by certbot's nginx plugin (otherwise: ssl_protocols TLSv1.2 TLSv1.3;)
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "same-origin" always;

	client_max_body_size 1m;

	location = /admin/api/login {
		limit_req zone=punchline_login burst=5 nodelay;
		limit_req_status 429;
		proxy_pass http://punchline_app;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
	}

	location / {
		proxy_pass http://punchline_app;
		proxy_http_version 1.1;

		# WebSocket (socket.io)
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;

		# socket.io pings every 25 s: keep idle WebSockets open well beyond that
		proxy_read_timeout 120s;
		proxy_send_timeout 120s;
	}
}
